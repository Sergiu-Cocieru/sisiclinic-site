question: "I have sensitive skin. Can I have sugaring?"
answer: "Often, yes. The paste is used at around body temperature and grips the hair rather than the skin, which many clients with sensitive skin find easier than waxing. A little redness for a few hours afterwards is normal. Before we start, tell us about any skin conditions, allergies or medication, such as retinoids or acne treatment. If sugaring isn't right for your skin at the moment, we will tell you."
