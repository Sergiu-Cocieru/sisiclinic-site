question: "Does laser work on all skin and hair types?"
answer: "Not equally. We use laser (not IPL), which targets the pigment in the hair, so results vary by skin tone and hair colour. Dark hair usually responds best. Blonde, grey, white and red hair respond less, and may not respond at all. We check your skin and hair at the free consultation and tell you honestly what to expect before you start."
