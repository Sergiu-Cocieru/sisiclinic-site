question: "Will sugaring help with ingrown hairs?"
answer: "It may help reduce them. Sugaring removes hair in the direction it grows, and some clients find they get fewer ingrown hairs than with shaving or waxing. Gentle exfoliation from a few days after your appointment and loose cotton clothing also help. If you are prone to ingrown hairs, tell us and we will suggest what to do between visits. See our [aftercare guide](/aftercare/)."
