question: "Can I book by phone or WhatsApp?"
answer: "Yes. Call or WhatsApp us on 07840 820525. We are open Monday to Friday 10:00 to 20:00 and Saturday 10:00 to 18:00. If we are with a client, send a WhatsApp or leave a message and we will get back to you. You can also book online at any time with the Book buttons on this site."
