question: "What if I need to cancel at short notice?"
answer: "Please let us know as soon as you can, using the link in your Treatwell confirmation email or by calling or messaging us on 07840 820525. An early message means another client can take the time. If you feel unwell, or have sunburn or broken or irritated skin on the area, it is better to move your appointment than to go ahead."
