question: "Can I shave between appointments?"
answer: "It is best not to. Shaving cuts the hair at the surface, so you would need to wait around two weeks for it to grow back to about 5 mm before your next sugaring. If you need a quick tidy-up before a holiday, trimming is better than shaving. Many clients find each visit gets easier when they stick with sugaring."
