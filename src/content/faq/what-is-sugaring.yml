question: "What is sugaring paste made of?"
answer: "Sugar, water and lemon. We use the paste warm, at around body temperature, and work it into the skin against the direction of hair growth. It is then flicked off in the direction the hair grows, taking the hair out from the root. Any residue washes off with water. Read more about [how sugaring works](/sugaring-hair-removal/)."
