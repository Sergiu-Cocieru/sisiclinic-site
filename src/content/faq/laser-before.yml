question: "What should I avoid before laser?"
answer: "Avoid sun, sunbeds and fake tan on the area for two weeks before. Don't sugar, wax or pluck the area for four weeks before, as the laser needs the hair root in place. Shave the area about 24 hours before your session. Tell us about any medication, including retinoids and acne treatment. We go through everything at your free consultation."
