question: "How is sugaring different from waxing?"
answer: "Sugar paste is used warm, at around body temperature, while wax is usually heated much more. Sugaring removes hair in the direction it grows, while waxing usually pulls against it. The paste grips the hair rather than the skin, so many people with sensitive skin find sugaring easier to tolerate. Both remove hair from the root, and sugaring results usually last three to five weeks."
