question: "Does sugaring hurt?"
answer: "It can sting for a moment, especially on a first visit or on intimate areas, but most clients find it very manageable. Because the paste is warm rather than hot and is flicked off in the direction of hair growth, many people who have tried waxing find sugaring more comfortable. It usually gets easier with regular visits, as the hair grows back finer."
